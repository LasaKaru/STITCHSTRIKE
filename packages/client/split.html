<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STITCHSTRIKE · Split-screen</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/arena.css" />
    <link rel="stylesheet" href="/src/split.css" />
  </head>
  <body class="split">
    <div id="app"></div>
    <div class="divider"></div>
    <div class="pview" id="p0"><div class="xh"></div><div class="phud"></div><div class="pdown hidden"></div></div>
    <div class="pview" id="p1"><div class="xh"></div><div class="phud"></div><div class="pdown hidden"></div></div>
    <div class="hud" id="shared"><div id="wave"></div><div id="phase"></div><div id="cores-line"></div></div>
    <div id="banner" class="hud"></div>
    <div id="join" class="card">
      <h1>SPLIT-SCREEN</h1>
      <p><b>Player 1</b>: keyboard + mouse (click to lock) or the first gamepad.<br><b>Player 2</b>: a gamepad. Press any button on it to join.</p>
      <p class="keys">Pad: sticks move/look · RT fire · A jump · Y hold re-stitch · LB/RB weapons · D-pad up deck · LT build · Start ready</p>
      <p class="go">Click to start</p>
      <p class="hint"><a href="/">← main menu</a></p>
    </div>
    <script type="module" src="/src/split-main.ts"></script>
  </body>
</html>
